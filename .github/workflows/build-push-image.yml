# Build and push ph-ee-connector-ams-mifos Docker image on push to main.
# Builds the JAR with Gradle, then builds and pushes the image.
# Dockerfile expects build/libs/*.jar and build/resources/main/keystore.jks; a placeholder keystore is created if missing.
# Tags: latest, <short-sha>
# Secrets: DOCKER_USER, DOCKER_PASSWORD. Optional var: DOCKER_ORGANIZATION (default nexusbank).
name: Build and push image

on:
  push:
    branches: [main, master, develop]
    paths:
      - '**.java'
      - 'build.gradle'
      - 'Dockerfile'
      - '.github/workflows/build-push-image.yml'
  workflow_dispatch:

env:
  IMAGE_NAME: ph-ee-connector-ams-mifos
  DOCKER_ORGANIZATION: ${{ vars.DOCKER_ORGANIZATION || 'nexusbank' }}

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Build with Gradle
        run: ./gradlew bootJar -x test --no-daemon

      - name: Ensure keystore for Docker build
        run: |
          mkdir -p build/resources/main
          if [ ! -f build/resources/main/keystore.jks ]; then
            keytool -genkeypair -alias selfsigned -keyalg RSA -keysize 2048 -storetype JKS \
              -keystore build/resources/main/keystore.jks -storepass openmf -keypass openmf \
              -dname "CN=CI, OU=CI, O=CI, L=CI, ST=CI, C=US" -validity 3650
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Git short SHA
        id: sha
        run: echo "short_sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.DOCKER_ORGANIZATION }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.DOCKER_ORGANIZATION }}/${{ env.IMAGE_NAME }}:${{ steps.sha.outputs.short_sha }}
